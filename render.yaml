services:
  - type: web
    name: yatra-desk
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: yatra-data
      mountPath: /var/data
      sizeGB: 1
