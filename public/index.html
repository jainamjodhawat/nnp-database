<style>
/* Layout: slim top bar with section tabs; content in one column that widens into 2-3 column chart grids. */
:root{

  --good-bg:#e4f4ea; --warn-bg:#fbefd6; --crit-bg:#fbe5e2;
  --shadow:0 1px 2px rgba(20,23,31,.06),0 6px 20px rgba(20,23,31,.05);

  --font-body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#181c24; --ink:#eceef3; --ink2:#b5bbc9; --muted:#8d95a8; --line:#272d39; --soft:#1f2430;
  --accent:#3987e5; --accent-strong:#3987e5; --on-accent:#0b0d12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#4cc07f; --warn:#e0a63a; --crit:#ef7b6e;
  --good-bg:#16301f; --warn-bg:#352a12; --crit-bg:#3a1b17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#181c24; --ink:#eceef3; --ink2:#b5bbc9; --muted:#8d95a8; --line:#272d39; --soft:#1f2430;
  --accent:#3987e5; --accent-strong:#3987e5; --on-accent:#0b0d12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#4cc07f; --warn:#e0a63a; --crit:#ef7b6e;
  --good-bg:#16301f; --warn-bg:#352a12; --crit-bg:#3a1b17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--font-display);font-size:20px}
.brand span{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.good i{background:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.warn i{background:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.crit i{background:var(--crit)}
.nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .count{background:var(--crit);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;margin-left:6px}
main{padding-top:22px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--ink2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.danger{color:var(--crit)}
.btn.small{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--ink2);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px}
.brow{display:grid;grid-template-columns:minmax(70px,150px) 1fr 44px;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.brow.click{cursor:pointer}.brow.click:hover .bl{color:var(--accent)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.bt{height:12px;background:var(--soft);border-radius:3px;overflow:hidden;display:block}
.bt i{display:block;height:100%;border-radius:0 4px 4px 0}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
svg .grid line{stroke:var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{position:sticky;top:0;text-align:left;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--soft);border-radius:5px;padding:1px 7px;color:var(--ink2);cursor:pointer;border:0}
.chip.tag{background:var(--warn-bg);color:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.cap{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.cap i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btns{justify-content:center;margin-top:14px}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(520px,100%);height:100%;overflow:auto;background:var(--surface);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0;font-size:14px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{background:var(--soft);border-radius:8px;padding:12px;min-width:0}
.cmp h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.step{display:flex;gap:12px;align-items:baseline}
.step .n{font-family:var(--font-display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--accent-strong);color:var(--on-accent);display:grid;place-items:center;flex:none;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:70;max-width:90vw}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:6px;max-width:260px;display:none;white-space:pre-line}
.mt{margin-top:8px}.muted{color:var(--muted)}.right{margin-left:auto}
.stat-ok{color:var(--good)}.stat-bad{color:var(--crit)}
.note{font-size:13px;color:var(--ink2)}
@media (max-width:560px){.cmp{grid-template-columns:1fr}dl{grid-template-columns:100px 1fr}.tile .v{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- state ---------- */
var S={people:{},regs:{},trips:{}}, _D=null;
var UI={view:'master',trip:null,tab:'overview',pq:'',pf:'all',tq:'',tg:'all',tsp:'all',tpd:'all',tn:'all',
  modal:null,confirm:null,newTrip:false,editTrip:false,toast:'',imp:newImp()};
var db=null, mode='connecting', loaded={p:false,r:false,t:false}, busy=0;
var dirty={p:new Set(),r:new Set(),t:new Set(),dt:new Set()};
var wb=null;
function newImp(){return {tripMode:'new',tripId:'',nt:{name:'',dest:'',start:'',end:'',cap:''},fileName:'',sheets:[],sheet:'',headers:[],rows:[],map:{},plan:null,busy:false,done:null}}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var inv=function(){_D=null};
function D(){ if(_D) return _D; var byP={},byT={}; Object.values(S.regs).forEach(function(r){(byP[r.p]=byP[r.p]||[]).push(r);(byT[r.t]=byT[r.t]||[]).push(r)}); return _D={byP:byP,byT:byT} }
var pname=function(p){return ((p.first||'')+' '+(p.last||'')).trim()||'(no name)'};
var rid=function(){var a=new Uint8Array(6);(crypto||window.crypto).getRandomValues(a);return Array.from(a).map(function(b){return b.toString(16).padStart(2,'0')}).join('')};
var fmtD=function(t,y){return new Date(t).toLocaleDateString('en-IN',y?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'})};
var fmtRange=function(t){ if(!t.start) return 'Dates not set'; return fmtD(t.start+'T00:00:00',true)+(t.end?' – '+fmtD(t.end+'T00:00:00',true):'') };
var sortedTrips=function(){return Object.values(S.trips).sort(function(a,b){return (b.start||'').localeCompare(a.start||'')||(b.created||0)-(a.created||0)})};

/* ---------- storage ---------- */
function fail(e){ toast('Could not save: '+((e&&e.code==='invalid_argument')?'you have view-only access.':(e&&e.message)||'storage error')) }
var saveQueue = Promise.resolve(), isApiServer = false, dbInfo = '';
var apiBase = (window.location.protocol === 'file:') ? 'http://localhost:3000' : '';

function setupLiveSync(){
  if (!window.EventSource) return;
  try {
    var es = new EventSource(apiBase + '/api/events');
    es.onmessage = function(ev){
      try {
        var msg = JSON.parse(ev.data);
        if (msg && msg.type === 'update' && !busy && !dirty.p.size && !dirty.r.size && !dirty.t.size && !dirty.dt.size) {
          fetch(apiBase + '/api/data', { cache: 'no-store' }).then(function(r){ return r.json() }).then(function(data){
            if (!busy && !dirty.p.size && !dirty.r.size && !dirty.t.size && !dirty.dt.size) {
              S.people = data.people || {};
              S.regs = data.regs || {};
              S.trips = data.trips || {};
              if (data.storage) dbInfo = data.storage;
              try{ localStorage.setItem('yatra.v1', JSON.stringify({people:S.people, regs:S.regs, trips:S.trips})); }catch(e){}
              inv();
              render();
            }
          }).catch(function(){});
        }
      } catch(e) {}
    };
  } catch(e) {}
}

async function connect(){
  // 1. Try server backend API
  try {
    var res = await fetch(apiBase + '/api/data', { cache: 'no-store' });
    if (res.ok) {
      var data = await res.json();
      S.people = data.people || {};
      S.regs = data.regs || {};
      S.trips = data.trips || {};
      dbInfo = data.storage || 'Cloud Database';
      isApiServer = true;
      mode = 'cloud';
      loaded.p = loaded.r = loaded.t = true;
      try{ localStorage.setItem('yatra.v1', JSON.stringify({people:S.people, regs:S.regs, trips:S.trips})); }catch(e){}
      inv();
      render();
      setupLiveSync();
      return;
    }
  } catch(e) {}

  // 2. Claude environment fallback
  var d=null; try{ d=(window.claude&&window.claude.use)?await window.claude.use('db'):null }catch(e){d=null}
  if(d){
    db=d; mode='cloud'; dbInfo = 'Shared Store';
    var merge=function(snap,key){var m={};snap.docs.forEach(function(x){Object.assign(m,(x.data()||{})[key]||{})});return m};
    db.collection('pshard').onSnapshot(function(s){ if(!busy&&!dirty.p.size){S.people=merge(s,'p')} loaded.p=true; inv(); render() },fail);
    db.collection('rshard').onSnapshot(function(s){ if(!busy&&!dirty.r.size){S.regs=merge(s,'r')} loaded.r=true; inv(); render() },fail);

    return;
  }

  try{
    var raw=localStorage.getItem('yatra.v1');
    if(raw){ var o=JSON.parse(raw); S.people=o.people||{}; S.regs=o.regs||{}; S.trips=o.trips||{} }
    localStorage.setItem('yatra.t','1');
    mode='browser';
  }catch(e){}
  loaded.p=loaded.r=loaded.t=true;
  inv();
  render();
}

async function commit(){
  busy++;
  try{
    if(isApiServer){
      var payload = { people: S.people, regs: S.regs, trips: S.trips };
      await (saveQueue = saveQueue.then(async function(){
        var res = await fetch(apiBase + '/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('Save failed with status ' + res.status);
      }));
      dirty.p.clear(); dirty.r.clear(); dirty.t.clear(); dirty.dt.clear();
      try{ localStorage.setItem('yatra.v1', JSON.stringify(payload)); }catch(e){}
    } else if(db){
      for(var c of Array.from(dirty.p)){ var o={}; Object.values(S.people).forEach(function(p){ if(p.id[0]===c) o[p.id]=p }); await db.collection('pshard').doc(c).set({p:o}); dirty.p.delete(c) }
      for(var k of Array.from(dirty.r)){ var t=k.split('_')[0], ch=k.split('_')[1], ro={}; Object.values(S.regs).forEach(function(r){ if(r.t===t&&r.p[0]===ch) ro[r.id]=r }); await db.collection('rshard').doc(k).set({t:t,r:ro}); dirty.r.delete(k) }
      for(var id of Array.from(dirty.t)){ await db.collection('trips').doc(id).set(S.trips[id]); dirty.t.delete(id) }
      for(var d of Array.from(dirty.dt)){ await db.collection('trips').doc(d).delete(); for(var h of '0123456789abcdef'){ await db.collection('rshard').doc(d+'_'+h).delete() } dirty.dt.delete(d) }
    } else {
      try{ localStorage.setItem('yatra.v1',JSON.stringify({people:S.people,regs:S.regs,trips:S.trips})) }catch(e){ toast('Browser storage is full or blocked.') }
      dirty.p.clear();dirty.r.clear();dirty.t.clear();dirty.dt.clear()
    }
  }catch(e){ fail(e) }
  busy--;
}
var markP=function(id){dirty.p.add(id[0])}, markR=function(r){dirty.r.add(r.t+'_'+r.p[0])}, markT=function(id){dirty.t.add(id)};

/* ---------- normalising ---------- */
var squash=function(s){return String(s==null?'':s).replace(/\s+/g,' ').trim()};
var titleCase=function(s){return squash(String(s==null?'':s).replace(/[.,]+/g,' ')).toLowerCase().replace(/(^|[\s\-'.])(\p{L})/gu,function(m,a,b){return a+b.toUpperCase()})};
var digits=function(v){return String(v==null?'':(typeof v==='number'?Math.round(v):v)).replace(/\D/g,'')};
var ph=function(v){var d=digits(v); if(d.length>10) d=d.slice(-10); return d};
function parseAge(v){ var m=String(v==null?'':v).match(/\d+(\.\d+)?/); if(!m) return null; var n=Math.round(parseFloat(m[0])); return (n>0&&n<110)?n:null }
function parseGender(v){ var s=squash(v).toLowerCase(); if(!s) return ''; if(s[0]==='m') return 'Male'; if(s[0]==='f') return 'Female'; return 'Other' }
var yes=function(v){return /^(y|yes|ha|haan|true|1)/i.test(squash(v))};
function toTs(v){ if(v instanceof Date) return v.getTime(); var t=Date.parse(v); return isNaN(t)?0:t }
async function sha(s){ try{ var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('yatra:'+s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('').slice(0,32) }catch(e){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'f'+(h>>>0).toString(16) } }

function sim(a,b){ if(a===b) return 1; if(!a||!b||a[0]!==b[0]||Math.abs(a.length-b.length)>3) return 0; var m=a.length,n=b.length,p=[],i,j; for(j=0;j<=n;j++)p[j]=j; for(i=1;i<=m;i++){var prev=p[0];p[0]=i;for(j=1;j<=n;j++){var t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}} return 1-p[n]/Math.max(m,n) }

/* ---------- sheet reading ---------- */
var FIELDS=[['first','First name'],['last','Last name'],['name','Full name (if one column)'],['gender','Gender'],['age','Age'],['phone','Phone'],['wa','WhatsApp number'],['emerg','Emergency contact'],['email','Email'],['idno','ID number (Aadhaar)'],['address','Address'],['ts','Submitted at (timestamp)'],['special','Special arrangement (Yes/No)']];
var DETECT=[['emerg',/emergency/i],['wa',/whats\s*app/i],['idno',/aadh|adhar|id\s*(card|no|number|proof)/i],['email',/e-?mail/i],['ts',/timestamp|submitted|submission/i],['first',/first\s*name|given/i],['last',/last\s*name|surname|family/i],['name',/^\s*(full\s*)?name\s*$/i],['gender',/gender|\bsex\b/i],['age',/\bage\b/i],['address',/address|location|city/i],['special',/garam|arrangement|special|diet|assist|require/i],['phone',/phone|mobile|contact/i]];

var shares=function(p,r){var a=[p.phone,p.wa].filter(function(x){return x&&x.length===10}),b=[r.phone,r.wa].filter(function(x){return x&&x.length===10});return a.some(function(x){return b.indexOf(x)>=0})};
function findMatch(people,rec){
  var list=Object.values(people), x;
  if(rec.idHash){ var same=list.filter(function(p){return p.idHash===rec.idHash});
    if(same.length){ x=same.find(function(p){return p.nk===rec.nk||sim(p.nk,rec.nk)>=.6||shares(p,rec)}); if(x) return {p:x,how:'id'}; return {flag:{p:same[0],s:0,why:'Same ID number, different name'}} } }
  x=list.find(function(p){return p.nk===rec.nk&&!(p.idHash&&rec.idHash&&p.idHash!==rec.idHash)&&shares(p,rec)}); if(x) return {p:x,how:'name+phone'};
  var best=null;

    var s=p.nk===rec.nk?1:sim(p.nk,rec.nk); if(s<.85) return; var sh=shares(p,rec);
    if((s===1&&!sh)||(s<1&&(sh||(p.email&&p.email===rec.email&&s>.9)))){ if(!best||s>best.s) best={p:p,s:s,why:s===1?'Same name, different phone number':'Similar name, same phone number'} }
  });

function ingest(recs,tripId,people,regs){
  var st={rows:recs.length,added:0,byId:0,byName:0,flagged:0,again:0,skipped:0,already:0,regs:0}, tp=new Set(), tr=new Set();
  var seen=new Set(Object.values(regs).filter(function(r){return r.t===tripId}).reduce(function(a,r){return a.concat(r.srcKeys||[])},[]));
  recs.forEach(function(rec){
    if(!rec.nk){st.skipped++;return}
    if(seen.has(rec.src)){st.already++;return} seen.add(rec.src);
    var m=findMatch(people,rec), p;
    if(m&&m.p){ p=m.p; if(m.how==='id') st.byId++; else st.byName++;
      var newer=rec.ts>=(p.lastTs||0); ['gender','phone','wa','emerg','email','address'].forEach(function(f){ if(rec[f]&&(newer||!p[f])) p[f]=rec[f] });
      if(rec.age!=null&&(newer||p.age==null)) p.age=rec.age; if(rec.idHash&&!p.idHash){p.idHash=rec.idHash;p.idLast4=rec.idLast4;p.idLen=rec.idLen}
      if(newer) p.lastTs=rec.ts;
    } else {
      p={id:rid(),first:rec.first,last:rec.last,nk:rec.nk,gender:rec.gender,age:rec.age,phone:rec.phone,wa:rec.wa,emerg:rec.emerg,email:rec.email,address:rec.address,
        idHash:rec.idHash,idLast4:rec.idLast4,idLen:rec.idLen,tags:[],notes:'',notSame:[],lastTs:rec.ts,created:Date.now(),flag:null};
      if(m&&m.flag&&!(m.flag.p.notSame||[]).length){ p.flag={of:m.flag.p.id,why:m.flag.why}; st.flagged++ }
      else if(m&&m.flag){ p.flag={of:m.flag.p.id,why:m.flag.why}; st.flagged++ }
      people[p.id]=p; st.added++;
    }
    tp.add(p.id);
    var key=tripId+'.'+p.id, r=regs[key];
    if(r){ st.again++; r.submissions=(r.submissions||1)+1; r.srcKeys=(r.srcKeys||[]).concat(rec.src); if(rec.special) r.special=rec.special; if(rec.age!=null) r.age=rec.age; if(rec.ts&&(!r.ts||rec.ts<r.ts)) r.ts=rec.ts }
    else { regs[key]={id:key,t:tripId,p:p.id,ts:rec.ts,age:rec.age,special:rec.special,paid:false,chk:false,notes:'',submissions:1,srcKeys:[rec.src]}; st.regs++ }
    tr.add(key);
  });
  return {st:st,tp:tp,tr:tr};
}

/* ---------- derived stats ---------- */
var band=function(a){return a==null?-1:a<18?0:a<30?1:a<45?2:a<60?3:4};
var BANDS=['Under 18','18–29','30–44','45–59','60+'];
function tripStats(tid){
  var regs=D().byT[tid]||[], g={Male:0,Female:0,Other:0}, b=[0,0,0,0,0], sum=0,n=0,sp=0,paid=0,chk=0,ret=0,days={};
  regs.forEach(function(r){ var p=S.people[r.p]; if(!p) return;
    g[p.gender||'Other']++; var a=r.age!=null?r.age:p.age; if(a!=null){sum+=a;n++;if(band(a)>=0)b[band(a)]++}
    if(r.special==='Yes') sp++; if(r.paid) paid++; if(r.chk) chk++; if((D().byP[r.p]||[]).length>1) ret++;
    if(r.ts){var d=new Date(r.ts);d.setHours(0,0,0,0);days[d.getTime()]=(days[d.getTime()]||0)+1} });
  var ks=Object.keys(days).map(Number).sort(function(a,c){return a-c}), series=[], cum=0;
  if(ks.length){ for(var t=ks[0];t<=ks[ks.length-1];t+=864e5){ var d=new Date(t); var add=days[t]||0; cum+=add; series.push({t:t,add:add,cum:cum}); } }

}
function issuesFor(tid){
  var out=[]; (D().byT[tid]||[]).forEach(function(r){ var p=S.people[r.p]; if(!p) return; var is=[];
    if(!(p.phone&&p.phone.length===10)&&!(p.wa&&p.wa.length===10)) is.push('No valid phone number');
    if(p.idLen!==12) is.push(p.idLen?'ID has '+p.idLen+' digits (expected 12)':'No ID number');
    var a=r.age!=null?r.age:p.age; if(a==null||a<5||a>90) is.push('Age missing or unusual');
    if(!p.emerg) is.push('No emergency contact'); else if(p.emerg===p.phone||p.emerg===p.wa) is.push('Emergency contact is the pilgrim’s own number');
    if(p.flag) is.push('Possible duplicate person (see Review)');

  return out.sort(function(a,b){return b.is.length-a.is.length});
}

function exportCSV(name,head,rows){
  var csv=[head].concat(rows).map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n');
  (async function(){
    try{
      var d=await window.claude.use('downloads');
      if(!d) throw 0;
      await d.save({filename:name,data:'﻿'+csv});
    }catch(e){
      if(e&&e.code==='declined') return;
      try {
        var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url) }, 1000);
        toast('Exported ' + name);
      } catch(err) {
        toast('Saving files is not available in this view.');
      }
    }
  })();
}
